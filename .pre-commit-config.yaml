repos:
  - repo: local
    hooks:
      - id: architecture-governance
        name: Enforce architecture governance
        entry: ..\..\venv\Scripts\python.exe -m tools.check_architecture
        language: system
        pass_filenames: false
        always_run: true
      - id: test-governance
        name: Enforce test governance
        entry: ..\..\venv\Scripts\python.exe -m tools.check_test_governance
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '(\.bat$|\.cmd$|\.ps1$)'
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: '(^web/dist/|tsconfig\.json$)'
      - id: check-toml
